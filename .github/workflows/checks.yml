name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: railsmith_example
          POSTGRES_PASSWORD: railsmith-example
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d railsmith_example"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository and publication patterns
        run: scripts/doctor
      - name: Check shell entrypoints
        run: bash -n scripts/adopt scripts/new-project scripts/doctor
      - name: Test repository checks
        run: python3 -m unittest discover -s tests -v
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install example test dependency
        run: gem install minitest --no-document
      - name: Test narrow-interface example
        run: ruby examples/narrow-interface/retry_schedule_test.rb
      - name: Install database example dependencies
        run: |
          gem install activerecord -v '~> 8.1.0' --no-document
          gem install pg -v '~> 1.6' --no-document
      - name: Test database contention example
        env:
          RAILSMITH_EXAMPLE_DATABASE_URL: postgresql://postgres:railsmith-example@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/railsmith_example
        run: ruby examples/database-contention/test/reading_list_entry_test.rb
      - name: Install Active Job example dependency
        run: gem install activejob -v '~> 8.1.0' --no-document
      - name: Test job redelivery example
        env:
          RAILSMITH_EXAMPLE_DATABASE_URL: postgresql://postgres:railsmith-example@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/railsmith_example
        run: ruby examples/job-redelivery/test/print_document_job_test.rb
